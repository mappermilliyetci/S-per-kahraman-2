      ctx.font='13px system-ui,sans-serif';ctx.fillStyle='#e8eaf6';
      const ls=wrapText(u.d,Math.floor((r.w-80)/6.6));
      for(let k=0;k<ls.length&&k<3;k++)ctx.fillText(ls[k],r.x+66,r.y+46+k*16);
    }else{
      ctx.textAlign='center';
      ctx.font='38px system-ui,sans-serif';ctx.fillStyle='#fff';ctx.fillText(u.ic,r.x+r.w/2,r.y+46);
      ctx.font='bold 16px system-ui,sans-serif';ctx.fillStyle='#ffd54f';ctx.fillText(u.n,r.x+r.w/2,r.y+72);
      ctx.font='bold 12px system-ui,sans-serif';ctx.fillStyle='#9be7ff';ctx.fillText('Seviye '+(lv+1)+'/'+u.max,r.x+r.w/2,r.y+90);
      ctx.font='13px system-ui,sans-serif';ctx.fillStyle='#e8eaf6';
      const ls=wrapText(u.d,Math.floor((r.w-20)/6.6));
      for(let k=0;k<ls.length&&k<3;k++)ctx.fillText(ls[k],r.x+r.w/2,r.y+110+k*16);
    }
  }
}

function drawBtn(r,label,bg,fg,alpha){
  ctx.globalAlpha=alpha===undefined?1:alpha;
  ctx.fillStyle=bg;rr(r.x,r.y,r.w,r.h,14);ctx.fill();
  ctx.font='bold '+Math.min(20,r.w/12)+'px system-ui,sans-serif';ctx.textAlign='center';ctx.fillStyle=fg;
  ctx.fillText(label,r.x+r.w/2,r.y+r.h/2+7);ctx.globalAlpha=1;
}

function drawSelect(){
  const W=cssW,H=cssH,h=hero,pal=h.pal;
  ctx.fillStyle='rgba(0,0,0,.74)';ctx.fillRect(0,0,W,H);
  selRects={};
  centerText('Kahramanını Seç',portrait?92:34,Math.min(28,W/13),'#ffd600');
  let px,py,sc,bx,bw,y;
  if(portrait){px=W/2;py=H*0.2;sc=Math.min(3.1,W/130,(H*0.24)/56);bw=Math.min(310,W-48);bx=(W-bw)/2;y=py+52*sc+14;}
  else{px=W*0.22;py=H*0.24;sc=Math.min(3,(H*0.5)/52);bw=Math.max(200,W-W*0.45-28);bx=W*0.45;y=72;}
  // aydınlatma, kaide ve kahraman
  const pop=1+0.12*Math.max(0,1-(frame-selPop)/14);
  const gr=ctx.createLinearGradient(0,py-10*sc,0,py+56*sc);
  gr.addColorStop(0,'rgba(255,255,255,0)');gr.addColorStop(1,pal.suit);
  ctx.globalAlpha=0.28;ctx.fillStyle=gr;ctx.beginPath();ctx.arc(px,py+24*sc,40*sc,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
  ctx.fillStyle='rgba(0,0,0,.45)';ctx.beginPath();ctx.ellipse(px,py+49*sc,36*sc,6.5*sc,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=pal.accent;ctx.globalAlpha=0.55+0.25*Math.sin(frame*0.08);ctx.lineWidth=2;
  ctx.beginPath();ctx.ellipse(px,py+49*sc,40*sc,7.5*sc,0,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;
  ctx.save();ctx.translate(px,py+48*sc);ctx.scale(sc*pop,sc*pop);ctx.translate(0,-48);
  const tt=frame%160,shooting=tt<24;
  drawHero(0,0,1,{vx:0,vy:0,ground:true,shoot:shooting,power:false},h);
  if(tt>=10&&tt<70){const shp=h.shot;drawBlast({x:26+(tt-10)*2.6,y:19-shp.h/2,w:shp.w,h:shp.h,vx:1,kind:shp.kind});}
  ctx.restore();
  // oklar
  const as=58,ay=py+24*sc-as/2;
  selRects.prev={x:Math.max(8,px-sc*36-as),y:ay,w:as,h:as};
  selRects.next={x:Math.min(W-as-8,px+sc*36),y:ay,w:as,h:as};
  for(const r of [selRects.prev,selRects.next]){
    ctx.fillStyle='rgba(255,255,255,.16)';ctx.beginPath();ctx.arc(r.x+as/2,r.y+as/2,as/2,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=2;ctx.stroke();
  }
  ctx.fillStyle='#fff';
  const pm=selRects.prev,nm=selRects.next;
  ctx.beginPath();ctx.moveTo(pm.x+as*0.6,pm.y+as*0.28);ctx.lineTo(pm.x+as*0.34,pm.y+as/2);ctx.lineTo(pm.x+as*0.6,pm.y+as*0.72);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(nm.x+as*0.4,nm.y+as*0.28);ctx.lineTo(nm.x+as*0.66,nm.y+as/2);ctx.lineTo(nm.x+as*0.4,nm.y+as*0.72);ctx.closePath();ctx.fill();
  // noktalar
  const dy=portrait?py+50*sc+6:py+50*sc+14;
  for(let i=0;i<HEROES.length;i++){
    ctx.fillStyle=i===heroIdx?'#ffd54f':'rgba(255,255,255,.3)';
    ctx.beginPath();ctx.arc(px+(i-(HEROES.length-1)/2)*18,dy,i===heroIdx?5:3.5,0,Math.PI*2);ctx.fill();
  }
  if(portrait)y=dy+22;
  // isim, açıklama
  const al=portrait?'center':'left',tx=portrait?W/2:bx;
  ctx.textAlign=al;
  ctx.font='bold '+(portrait?26:24)+'px system-ui,sans-serif';ctx.fillStyle='#ffd54f';ctx.fillText(h.name,tx,y+(portrait?6:0));
  ctx.font='bold 13px system-ui,sans-serif';ctx.fillStyle=pal.suit;
  ctx.fillStyle='#9be7ff';ctx.fillText(h.title,tx,y+(portrait?26:20));
  ctx.font='13px system-ui,sans-serif';ctx.fillStyle='#e8eaf6';
  const lines=wrapText(h.desc,Math.floor(bw/6.6));
  let ly=y+(portrait?48:40);
  for(const l of lines){ctx.fillText(l,tx,ly);ly+=17;}
  // istatistikler
  const rows=[['Can',h.stats.can],['Hız',h.stats.hiz],['Güç',h.stats.guc],['Çeviklik',h.stats.cev]];
  const rh=portrait?23:19;ly+=portrait?6:2;
  const lw=64,barW=Math.min(150,bw-lw-8);
  const sx0=portrait?(W-(lw+barW))/2:bx;
  for(const [name,v] of rows){
    ctx.textAlign='left';ctx.font='bold 12px system-ui,sans-serif';ctx.fillStyle='#fff';ctx.fillText(name,sx0,ly+10);
    for(let k=0;k<5;k++){
      ctx.fillStyle=k<v?pal.suit:'rgba(255,255,255,.15)';
      rr(sx0+lw+k*(barW/5),ly+1,barW/5-4,10,3);ctx.fill();
    }
    ly+=rh;
  }
  ctx.textAlign=al;
  ly+=portrait?12:14;
  ctx.font='bold 13px system-ui,sans-serif';ctx.fillStyle='#ffeb3b';ctx.fillText('★ '+h.spName,tx,ly);
  ctx.font='12px system-ui,sans-serif';ctx.fillStyle='#e8eaf6';
  const sl=wrapText(h.spDesc,Math.floor(bw/6.2));
  ly+=16;for(const l of sl){ctx.fillText(l,tx,ly);ly+=15;}
  // başla düğmesi
  const bh=54,by=portrait?Math.max(ly+8,H-92):Math.max(ly+6,H-bh-14);
  const r={x:portrait?bx:bx,y:Math.min(by,H-bh-10),w:Math.min(290,bw),h:bh};
  selRects.start=r;
  drawBtn(r,'BAŞLA','#ffd54f','#222');
}

function mtx(t,x,y,size,col,al){ctx.globalAlpha=al===undefined?1:al;ctx.font='bold '+size+'px system-ui,sans-serif';ctx.textAlign='center';ctx.fillStyle=col;ctx.fillText(t,x,y);ctx.globalAlpha=1;}
function drawMenuScreen(){
  const W=cssW,H=cssH;
  ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,0,W,H);
  menuRects={};
  const infoLines=(x,y,sz)=>{
    mtx('⚡ ateş  ▲ zıpla (havada tekrar bas)',x,y,sz,'#ddd');
    mtx('» atılış  ★ süper güç',x,y+sz+5,sz,'#ddd');
    let yy=y+2*sz+22;
    if(best){mtx('En yüksek puan: '+best,x,yy,Math.min(16,W/24),'#ffd54f');yy+=22;}
    mtx('🏆 Başarımlar: '+achCount()+'/'+ACH.length,x,yy,Math.min(14,W/26),'#ffe082');
    return yy;
  };
  let bottom;
  if(portrait){
    const big=Math.min(54,W/9),cy=H*0.2;
    mtx('ŞİMŞEK',W/2,cy,big,'#ffd600');mtx('KAHRAMAN',W/2,cy+big*1.05,big,'#ffd600');
    const s=Math.min(2.2,W/170),hy=cy+big*1.05+26;
    ctx.save();ctx.translate(W/2,hy);ctx.scale(s,s);drawHero(0,0,1,{vx:0,vy:0,ground:true},hero);ctx.restore();
    let y=hy+50*s+22;
    mtx('Şehri robotlardan kurtar!',W/2,y,Math.min(20,W/20),'#fff');y+=18;
    const bw=Math.min(310,W-48),bh=56,bx=(W-bw)/2;
    menuRects.solo={x:bx,y:y,w:bw,h:bh};drawBtn(menuRects.solo,'▶  Tek Kişilik','#ffd54f','#222');y+=bh+12;
    menuRects.multi={x:bx,y:y,w:bw,h:bh};drawBtn(menuRects.multi,'👥  Arkadaşla Oyna','#4fc3f7','#08243a');y+=bh+28;
    bottom=infoLines(W/2,y,Math.min(13,W/30));
  }else{
    const cx=W*0.27,big=Math.min(46,H/8),cy=H*0.26;
    mtx('ŞİMŞEK',cx,cy,big,'#ffd600');mtx('KAHRAMAN',cx,cy+big*1.02,big,'#ffd600');
    const s=Math.min(1.5,(H*0.3)/52),hy=cy+big*1.02+16;
    ctx.save();ctx.translate(cx,hy);ctx.scale(s,s);drawHero(0,0,1,{vx:0,vy:0,ground:true},hero);ctx.restore();
    mtx('Şehri robotlardan kurtar!',cx,hy+50*s+20,Math.min(18,W/40),'#fff');
    const bw=Math.min(300,W*0.4),bh=52,bx=W*0.52,x2=bx+bw/2;
    let y=Math.max(30,H*0.16);
    menuRects.solo={x:bx,y:y,w:bw,h:bh};drawBtn(menuRects.solo,'▶  Tek Kişilik','#ffd54f','#222');y+=bh+12;
    menuRects.multi={x:bx,y:y,w:bw,h:bh};drawBtn(menuRects.multi,'👥  Arkadaşla Oyna','#4fc3f7','#08243a');y+=bh+26;
    bottom=infoLines(x2,y,12);
  }
  if(MP.leaveMsg)mtx(MP.leaveMsg,W/2,H-46,Math.min(15,W/26),'#ff8a80');
  if(MP.toastT>0)mtx(MP.toast,W/2,H-46,14,'#ffd54f');
  const sw=140,sh=30;
  menuRects.server={x:(W-sw)/2,y:H-sh-8,w:sw,h:sh};
  mtx('⚙ Sunucu adresi',W/2,H-16,12,'rgba(255,255,255,.55)');
}

function drawLobby(){
  const W=cssW,H=cssH,host=MP.role==='host';
  ctx.fillStyle='rgba(0,0,0,.78)';ctx.fillRect(0,0,W,H);
  lobbyRects={};
  const top=portrait?92:30;
  mtx(host?'Arkadaşla Oyna':'Oyuna Katıl',W/2,top,Math.min(28,W/13),'#ffd600');
  const st=MP.err||MP.status||'';
  const lines=wrapText(st,Math.floor(Math.min(W-30,460)/7.4));
  let y=top+(portrait?26:22);
  for(const l of lines.slice(0,2)){mtx(l,W/2,y,13,MP.err?'#ff8a80':'#9be7ff');y+=17;}
  y+=portrait?6:2;
  const bw=Math.min(340,W-32),bx=(W-bw)/2;
  if(host&&MP.ready&&!MP.err){
    const ph=portrait?76:54;
    ctx.fillStyle='rgba(255,255,255,.1)';rr(bx,y,bw,ph,14);ctx.fill();
    mtx('Davet kodu',W/2,y+(portrait?20:16),12,'#bbb');
    mtx(MP.code,W/2,y+(portrait?58:44),portrait?36:30,'#fff');
    y+=ph+8;
    const bh=portrait?48:40;
    lobbyRects.share={x:bx,y:y,w:bw/2-5,h:bh};drawBtn(lobbyRects.share,'📤 Linki Paylaş','#4fc3f7','#08243a');
    lobbyRects.copy={x:bx+bw/2+5,y:y,w:bw/2-5,h:bh};drawBtn(lobbyRects.copy,'📋 Kopyala','rgba(255,255,255,.22)','#fff');
    y+=bh+10;
  }else if(!host){
    mtx('Oda: '+MP.code,W/2,y+14,15,'#fff');y+=26;
  }
  // kahramanlar
  const bottomH=portrait?132:74;
  const areaT=y,areaB=H-bottomH-6;
  const sc=Math.max(0.9,Math.min(portrait?2.1:1.6,(areaB-areaT-44)/62));
  const fy=areaB-30;
  const x1=W*0.27,x2=W*0.73;
  const drawPick=(x,H_,face,label,arrows)=>{
    ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(x,fy+2,26*sc,5*sc,0,0,Math.PI*2);ctx.fill();
    ctx.save();ctx.translate(x,fy-47*sc);ctx.scale(sc,sc);drawHero(0,0,face,{vx:0,vy:0,ground:true,shoot:false},H_);ctx.restore();
    mtx(H_.name,x,fy+18,15,'#ffd54f');
    mtx(label,x,fy+34,11,'#9be7ff');
  };
  const mine=HEROES[heroIdx];
  drawPick(x1,mine,1,'Sen');
  const as=Math.min(46,W*0.11),ay=fy-47*sc/2-as/2;
  lobbyRects.prev={x:Math.max(6,x1-30*sc-as-6),y:ay,w:as,h:as};
  lobbyRects.next={x:x1+30*sc+6,y:ay,w:as,h:as};
  for(const r of [lobbyRects.prev,lobbyRects.next]){
    ctx.fillStyle='rgba(255,255,255,.16)';ctx.beginPath();ctx.arc(r.x+as/2,r.y+as/2,as/2,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=2;ctx.stroke();
  }
  ctx.fillStyle='#fff';
  const pm=lobbyRects.prev,nm=lobbyRects.next;
  ctx.beginPath();ctx.moveTo(pm.x+as*0.6,pm.y+as*0.28);ctx.lineTo(pm.x+as*0.34,pm.y+as/2);ctx.lineTo(pm.x+as*0.6,pm.y+as*0.72);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(nm.x+as*0.4,nm.y+as*0.28);ctx.lineTo(nm.x+as*0.66,nm.y+as/2);ctx.lineTo(nm.x+as*0.4,nm.y+as*0.72);ctx.closePath();ctx.fill();
  const oh=host?(MP.helloGot?MP.rHero:-1):MP.otherHero;
  if(MP.connected&&oh>=0){drawPick(x2,HEROES[oh],-1,'Arkadaşın');}
  else{
    mtx('?',x2,fy-47*sc/2+12,Math.round(44*sc/1.4),'rgba(255,255,255,.3)');
    mtx(MP.connected?'Arkadaşın':'Arkadaşın bekleniyor…',x2,fy+18,13,'#9be7ff');
  }
  // alt düğmeler
  const bh=portrait?56:48;
  if(portrait){
    const sy=H-bottomH+6;
    lobbyRects.start={x:bx,y:sy,w:bw,h:bh};
    lobbyRects.back={x:bx,y:sy+bh+10,w:bw,h:44};
  }else{
    const sy=H-bh-14;
    lobbyRects.start={x:bx,y:sy,w:bw*0.62,h:bh};
    lobbyRects.back={x:bx+bw*0.62+10,y:sy,w:bw*0.38-10,h:bh};
  }
  if(host){
    const ok=MP.connected&&MP.helloGot;
    drawBtn(lobbyRects.start,ok?'BAŞLA':'Arkadaşın bekleniyor…',ok?'#ffd54f':'rgba(255,255,255,.15)',ok?'#222':'#aaa');
  }else{
    drawBtn(lobbyRects.start,MP.connected?'Ev sahibi başlatınca açılır…':'Bağlanılıyor…','rgba(255,255,255,.15)','#bbb');
  }
  drawBtn(lobbyRects.back,'← Geri','rgba(255,255,255,.2)','#fff');
  if(MP.toastT>0)mtx(MP.toast,W/2,H-bottomH-14,14,'#ffd54f');
}

function drawOverlays(){
  const W=cssW,H=cssH,cy=portrait?H*0.3:H*0.42;
  const big=Math.min(54,W/9);
  if(state==='play'&&bannerT>0){
    const a=Math.min(1,bannerT/30);
    const by=portrait?H*0.3:H*0.52;
    centerText(bannerText,by,Math.min(48,W/10),'#fff',a);
    if(bannerSub)centerText(bannerSub,by+34,Math.min(22,W/22),'#ffd54f',a);
  }
  if(state==='menu')drawMenuScreen();
  if(state==='pause'){
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);
    centerText('DURAKLATILDI',cy,Math.min(44,W/10),'#fff');
    centerText(MP.on&&MP.role==='guest'?'Ev sahibi devam ettirecek':'Devam etmek için dokun',cy+38,20,'#9be7ff');
  }
  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
    centerText('OYUN BİTTİ',cy,Math.min(50,W/9),'#ff5252');
    centerText('Puan: '+score+'   En yüksek: '+best,cy+38,Math.min(22,W/18),'#fff');
    const a=stateT>45?1:0.35,bw=Math.min(300,W-48),bh=54,bx=(W-bw)/2;
    let by=cy+58;
    overRects={};
    if(continues>0){
      centerText('Devam edersen puanın %30 azalır',by+10,13,'#bbb',a);by+=22;
      overRects.cont={x:bx,y:by,w:bw,h:bh};drawBtn(overRects.cont,'Bölümü Tekrar Dene ('+continues+')','#ffd54f','#222',a);by+=bh+12;
    }
    overRects.menu={x:bx,y:by,w:bw,h:bh};drawBtn(overRects.menu,MP.on&&MP.role==='host'?'Lobiye Dön':'Ana Menü','rgba(255,255,255,.2)','#fff',a);
  }
  if(state==='win'){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
    centerText('TEBRİKLER!',cy,Math.min(54,W/8),'#ffd600');
    centerText('Şehir kurtuldu!',cy+38,Math.min(24,W/16),'#fff');
    centerText('Puan: '+score+'   En yüksek: '+best,cy+72,Math.min(20,W/18),'#ffd54f');
    centerText(MP.on?(MP.role==='host'?'Lobiye dönmek için dokun':'Çıkmak için dokun'):'Menüye dönmek için dokun',cy+110,Math.min(20,W/18),'#9be7ff',stateT>45?1:0.3);
  }
  if(state==='upgrade')drawUpgrade();
  if(state==='select')drawSelect();
  if(state==='lobby')drawLobby();
}

function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#000';ctx.fillRect(0,0,cssW,cssH);
  const sx=shake>0?(Math.random()-.5)*shake:0,sy=shake>0?(Math.random()-.5)*shake:0;
  ctx.setTransform(scale*dpr,0,0,scale*dpr,(sx*scale)*dpr,(offY*scale+sy*scale)*dpr);
  ctx.save();
  drawBG();
  ctx.translate(-camX,0);
  drawWorld();
  if(P&&(state==='play'||state==='pause'||state==='over'||state==='win'||state==='upgrade')){drawPlayer();if(MP.on&&PC&&PC.P)drawPartner();}
  ctx.restore();
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(flashW>0){ctx.fillStyle='rgba(255,255,255,'+(flashW/16)+')';ctx.fillRect(0,0,cssW,cssH);}
  if(flashR>0){ctx.fillStyle='rgba(255,0,0,'+(flashR/30)+')';ctx.fillRect(0,0,cssW,cssH);}
  if(state==='play'||state==='pause'||state==='over'||state==='win')drawHUD();
  drawOverlays();
}

/* =====================  DÖNGÜ  ===================== */
buildLevel(1);P=newPlayer();
resize();
setState('menu');
(function(){const c=String(QS.get('oda')||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(c.length>=3){MP.code=c;mpJoin();}})();
let lastT=0,acc=0;
function loop(t){
  const dt=Math.min(100,t-lastT);lastT=t;acc+=dt;
  while(acc>=16.667){
    frame++;stateT++;
    mpNetTick();
    if(MP.on&&MP.role==='guest'){guestTick();}
    else if(state==='play'){
      update();
      if(state==='play'){updateCam();if(PC&&MP.on&&MP.role==='host')asPartner(updateCam);}
      mpHostSend();
    }else{
      if(state==='menu'||state==='select'||state==='lobby')camX=(frame*0.7)%1200;
      else if(MP.on&&MP.role==='host')mpHostSend();
    }
    acc-=16.667;
  }
  draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
